<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utec Support | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="images/fav.png">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #4A2594;
            border-radius: 10px;
        }

        .dropdown-animate {
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-[#F8FAFC] text-slate-800" x-data="{ mobileMenu: false }">

    <header class="sticky top-0 z-50 w-full bg-[#4A2594] border-b border-white/10 shadow-lg">
        <div class="max-w-[1440px] mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="shrink-0">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <div class="bg-white rounded-xl shrink-0">
                            <img src="images/logo.png" alt="UTEC Logo" class="w-8 h-8 sm:w-14 sm:h-14 rounded-xl">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-white font-black text-lg sm:text-xl leading-none">Process</span>
                            <span
                                class="bg-gradient-to-r from-yellow-400 to-yellow-200 bg-clip-text text-transparent text-[10px] sm:text-[14px] font-bold tracking-tight sm:tracking-widest whitespace-nowrap">
                                Support Helpdesk <i class="fas fa-headset"></i>
                            </span>
                        </div>
                    </div>
                </a>

                <nav class="hidden lg:flex items-center space-x-1">
                    <a href="#"
                        class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white/90 hover:text-white rounded-lg hover:bg-white/10 transition-all group">
                        <svg class="w-4 h-4 transition-transform group-hover:-translate-y-1" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Home
                    </a>
                    <a href="index.html"
                        class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white/90 hover:text-white rounded-lg hover:bg-white/10 transition-all group">
                        <svg class="w-4 h-4 transition-transform group-hover:-translate-y-1" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
                        </svg>
                        Dashboard
                    </a>
                    <div class="relative" x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false">
                        <button
                            class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white/90 hover:text-white rounded-lg hover:bg-white/10 transition-all">
                            <svg class="w-4 h-4 transition-transform group-hover:-translate-y-1" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-width="2"
                                    d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            Pages
                            <svg class="w-3 h-3 transition-transform group-hover:-translate-y-1"
                                :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div x-show="open" x-cloak x-transition
                            class="absolute top-full left-0 w-64 bg-white shadow-2xl rounded-xl border border-slate-200 mt-0 py-2 dropdown-animate">
                            <a href="caseData.html"
                                class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-200">
                                <svg class="w-4 h-4 text-sky-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                                </svg>
                                Helpdesk Cases
                            </a>
                            <a href="uploadedData.html"
                                class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-200">
                                <svg class="w-4 h-4 text-sky-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                                </svg>
                                Uploaded Data
                            </a>
                        </div>
                    </div>
                </nav>

                <div class="flex items-center gap-2 sm:gap-4">
                    <div class="relative group" x-data="{ open: false }">
                        <button
                            class="flex items-center gap-3 p-1 rounded-full bg-white/5 hover:bg-white/10 transition-colors">
                            <img class="w-9 h-9 rounded-full border-2 border-white/20" src="images/user.png" alt="User">
                            <div class="hidden sm:block text-left pr-2">
                                <p class="text-xs font-bold text-white leading-tight">Username</p>
                                <p class="text-[12px] text-purple-300 font-medium">Admin</p>
                            </div>
                        </button>
                        <div
                            class="hidden group-hover:block absolute right-0 w-64 bg-white shadow-2xl rounded-xl border border-slate-200 mt-0 dropdown-animate p-2">
                            <a href="#"
                                class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                                Change Password
                            </a>
                            <div class="h-[1px] bg-slate-100 my-1"></div>
                            <a href="#"
                                class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-width="2"
                                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>

                    <button @click="mobileMenu = !mobileMenu" class="lg:hidden p-2 text-white outline-none">
                        <i class="fas" :class="mobileMenu ? 'fa-times' : 'fa-bars'"></i>
                    </button>
                </div>
            </div>
        </div>

        <div x-show="mobileMenu" x-cloak x-transition
            class="lg:hidden bg-white border-t border-slate-200 shadow-2xl h-64 overflow-y-auto">
            <div class="px-4 py-4 space-y-2">
                <a href="#" class="block px-4 py-3 text-slate-700 font-bold hover:bg-slate-50 rounded-lg"><i
                        class="fas fa-home mr-2 text-purple-700"></i> Home</a>
                <a href="helpdeskDash.html"
                    class="block px-4 py-3 text-slate-700 font-bold hover:bg-slate-50 rounded-lg"><i
                        class="fas fa-dashboard mr-2 text-purple-700"></i> Dashboard</a>
                <a href="caseData.html" class="block px-4 py-3 text-slate-700 font-bold hover:bg-slate-50 rounded-lg"><i
                        class="fas fa-database mr-2 text-purple-700"></i> Helpdesk Cases Data</a>
                <a href="uploadedData.html"
                    class="block px-4 py-3 text-slate-700 font-bold hover:bg-slate-50 rounded-lg"><i
                        class="fas fa-database mr-2 text-purple-700"></i> Uploaded Data</a>
                <button @click="mobileMenu = false; document.getElementById('openModal').click()"
                    class="w-full text-left px-4 py-3 text-slate-700 font-bold hover:bg-slate-50 rounded-lg"><i
                        class="fas fa-upload mr-2 text-purple-700"></i> Upload</button>
                <div class="border-t border-slate-100 pt-2">
                    <a href="#" class="block px-4 py-3 text-red-600 font-bold hover:bg-red-50 rounded-lg"><i
                            class="fas fa-key mr-2"></i> Change Password</a>
                    <a href="#" class="block px-4 py-3 text-red-600 font-bold hover:bg-red-50 rounded-lg"><i
                            class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 pb-28 mb-10">
        <section class="mt-1 bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden mb-1">
            <div
                class="flex items-center gap-3 mb-0 bg-gradient-to-r from-slate-900 via-sky-900 to-slate-900 p-2 rounded-1xl border border-purple-100">
                <div class="bg-white p-1 rounded-lg shadow-sm ml-6">
                    <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m3 7h-6m6 4h-6m6-8h-6" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Case Submission Form</h3>
                    <p class="text-xs text-slate-300">Please provide all necessary technical details</p>
                </div>
            </div>

            <form class="p-4 sm:p-10 space-y-8" action="helpdeskDash.html">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-6">

                    <div class="space-y-2 group">
                        <label for="advisorName"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Advisor Name <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-headset"></i></span>
                            <input type="text" id="advisorName" name="advisorName" placeholder="Enter Advisor Name"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="entryDate"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Date <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <input type="date" id="entryDate" name="entryDate"
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="userName"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            User Name <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-user"></i></span>
                            <input type="text" id="userName" name="userName" placeholder="John Doe"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="contactNumber"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Contact Number <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-phone"></i></span>
                            <input type="tel" id="contactNumber" name="contactNumber" placeholder="+91 0000000000"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="userEmail"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            User Email <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-envelope"></i></span>
                            <input type="email" id="userEmail" name="userEmail" placeholder="john@example.com"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="emailSubject"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Email Subject <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-mail-bulk"></i></span>
                            <input type="text" id="emailSubject" name="emailSubject" placeholder="Enter Subject"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="chatId"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Chat ID <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-comments"></i></span>
                            <input type="text" id="chatId" name="chatId" placeholder="CH-12345"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="source"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Source <span class="text-red-500">*</span>
                        </label>
                        <select id="source" name="source"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                            <option selected disabled>Select Here</option>
                            <option>Call</option>
                            <option>Chat</option>
                            <option>Email</option>
                        </select>
                    </div>

                    <div class="space-y-2 group">
                        <label for="persona"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Persona <span class="text-red-500">*</span>
                        </label>
                        <select id="persona" name="persona"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                            <option selected disabled>Select Here</option>
                            <option>TE</option>
                            <option>LATF</option>
                            <option>MLE</option>
                            <option>TMTCS</option>
                            <option>BPD AM</option>
                            <option>RHT</option>
                            <option>ZHT</option>
                            <option>SSC</option>
                            <option>SE</option>
                            <option>RE</option>
                            <option>RE UBS</option>
                            <option>ECL</option>
                            <option>ZECL</option>
                            <option>ZBDM</option>
                            <option>CRM</option>
                        </select>
                    </div>

                    <div class="space-y-2 group">
                        <label for="pincode"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Pincode <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-map-pin"></i></span>
                            <input type="text" id="pincode" name="pincode" placeholder="6-digit Pincode"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="depot"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Depot <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-warehouse"></i></span>
                            <input type="text" id="depot" name="depot" placeholder="Enter Depot"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="region"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Region <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-map-marked-alt"></i></span>
                            <input type="text" id="region" name="region" placeholder="Enter Region"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="zone"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Zone <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i
                                    class="fas fa-globe"></i></span>
                            <input type="text" id="zone" name="zone" placeholder="Enter Zone"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                        </div>
                    </div>

                    <div class="space-y-2 group">
                        <label for="category"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Category <span class="text-red-500">*</span>
                        </label>
                        <select id="category" name="category"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                            <option selected disabled>Select Here</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                        </select>
                    </div>

                    <div class="space-y-2 group">
                        <label for="subCategory"
                            class="block text-xs font-bold text-slate-500 uppercase tracking-widest group-focus-within:text-[#4A2594] transition-colors">
                            Sub-Category <span class="text-red-500">*</span>
                        </label>
                        <select id="subCategory" name="subCategory"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-[#4A2594] transition-all text-sm font-medium">
                            <option selected disabled>Select Here</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                        </select>
                    </div>

                    <div class="space-y-2 group">
                        <label for="disposition"

    <script>
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');
        const modal = document.getElementById('modalOverlay');

        openBtn.onclick = () => { modal.classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        const hideModal = () => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; }
        closeBtn.onclick = hideModal;
        modal.onclick = (e) => { if (e.target === modal) hideModal(); }
    </script>
